<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TadbeerGo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #063F35;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .splash-container {
      text-align: center;
      padding: 24px;
      max-width: 400px;
    }
    .logo {
      width: 110px;
      height: 110px;
      border-radius: 24px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
      margin-bottom: 24px;
      animation: pulse 2s infinite ease-in-out;
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }
    p {
      font-size: 15px;
      color: rgba(255, 255, 255, 0.8);
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3.5px solid rgba(255, 255, 255, 0.2);
      border-top-color: #34d399;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin: 0 auto;
    }
    .offline-box {
      display: none;
      margin-top: 16px;
    }
    .retry-btn {
      background: #10b981;
      color: #ffffff;
      border: none;
      padding: 12px 28px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
      transition: all 0.2s ease;
    }
    .retry-btn:hover {
      background: #059669;
      transform: translateY(-1px);
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <img src="icon-192.png" alt="TadbeerGo" class="logo" onerror="this.style.display='none'">
    <h1>TadbeerGo</h1>
    <p id="status-text">অ্যাপ লোড হচ্ছে...</p>
    <div id="loader" class="spinner"></div>

    <div id="offline-actions" class="offline-box">
      <p style="color: #fca5a5; font-size: 14px;">ইন্টারনেট সংযোগ পাওয়া যায়নি। অনুগ্রহ করে সংযোগ চেক করে আবার চেষ্টা করুন।</p>
      <button class="retry-btn" onclick="checkConnectionAndNavigate()">আবার চেষ্টা করুন</button>
    </div>
  </div>

  <script>
    const TARGET_URL = 'https://tadbeergo.vercel.app/';

    function checkConnectionAndNavigate() {
      const statusText = document.getElementById('status-text');
      const loader = document.getElementById('loader');
      const offlineBox = document.getElementById('offline-actions');

      statusText.textContent = 'সংযোগ পরীক্ষা করা হচ্ছে...';
      loader.style.display = 'block';
      offlineBox.style.display = 'none';

      if (!navigator.onLine) {
        showOffline();
        return;
      }

      // Check if target URL or network is reachable
      fetch(TARGET_URL, { mode: 'no-cors', cache: 'no-store' })
        .then(() => {
          statusText.textContent = 'লোড হচ্ছে...';
          window.location.replace(TARGET_URL);
        })
        .catch(() => {
          showOffline();
        });
    }

    function showOffline() {
      document.getElementById('status-text').textContent = 'অফলাইন মোড';
      document.getElementById('loader').style.display = 'none';
      document.getElementById('offline-actions').style.display = 'block';
    }

    window.addEventListener('online', checkConnectionAndNavigate);

    // Initial load attempt
    setTimeout(checkConnectionAndNavigate, 500);
  </script>
</body>
</html>
