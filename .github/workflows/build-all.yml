name: Build All Apps (Android, iOS, Desktop)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish a GitHub Release with all built apps?'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # ==========================================
  # 1. ANDROID APP BUILD (APK)
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./android/gradlew

      - name: Build Android Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Easy Download
        run: |
          mkdir -p release-artifacts/android
          cp android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/android/TadbeerGo.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: TadbeerGo-Android-APK
          path: release-artifacts/android/TadbeerGo.apk
          retention-days: 14

  # ==========================================
  # 2. APPLE iOS APP BUILD
  # ==========================================
  build-ios:
    name: Build Apple iOS App
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS App with Xcode
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR=./build \
            clean build

      - name: Package Payload as IPA
        run: |
          cd ios/App
          mkdir -p Payload
          cp -r ./build/App.app Payload/
          zip -r TadbeerGo-iOS-unsigned.ipa Payload
          mkdir -p ../../release-artifacts/ios
          mv TadbeerGo-iOS-unsigned.ipa ../../release-artifacts/ios/

      - name: Upload iOS App
        uses: actions/upload-artifact@v4
        with:
          name: TadbeerGo-iOS-IPA
          path: release-artifacts/ios/TadbeerGo-iOS-unsigned.ipa
          retention-days: 14

  # ==========================================
  # 3. DESKTOP BUILDS (Windows, macOS, Linux)
  # ==========================================
  build-desktop:
    name: Build Desktop (${{ matrix.target.name }})
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: Windows (exe)
            os: windows-latest
            build_cmd: npm run desktop:dist:win
          - name: macOS (dmg & zip)
            os: macos-latest
            build_cmd: npm run desktop:dist:mac
          - name: Linux (AppImage & deb)
            os: ubuntu-latest
            build_cmd: npm run desktop:dist:linux

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools fakeroot dpkg

      - name: Install Dependencies
        run: npm install

      - name: Build Desktop App
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ${{ matrix.target.build_cmd }}

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TadbeerGo-Desktop-${{ matrix.target.name }}
          path: |
            dist-desktop/*.exe
            dist-desktop/*.dmg
            dist-desktop/*.zip
            dist-desktop/*.AppImage
            dist-desktop/*.deb
          retention-days: 14

  # ==========================================
  # 4. AUTOMATIC GITHUB RELEASE
  # ==========================================
  create-release:
    name: Publish GitHub Release
    needs: [build-android, build-ios, build-desktop]
    if: always() && (startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-releases

      - name: Organize release files
        run: |
          mkdir -p release-files
          find all-releases -type f \( -name "*.apk" -o -name "*.ipa" -o -name "*.exe" -o -name "*.dmg" -o -name "*.zip" -o -name "*.AppImage" -o -name "*.deb" \) -exec cp {} release-files/ \;
          ls -la release-files

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          name: "TadbeerGo App Release ${{ github.ref_name || 'v1.0.0' }}"
          body: |
            ## TadbeerGo মাল্টি-প্ল্যাটফর্ম অ্যাপস

            স্বয়ংক্রিয়ভাবে তৈরি হওয়া ইনস্টলেশন ফাইলগুলো নিচে দেওয়া হলো:
            - 📱 **Android**: `TadbeerGo.apk`
            - 🍎 **iOS**: `TadbeerGo-iOS-unsigned.ipa` (AltStore, TrollStore বা Sideloadly দিয়ে ইনস্টলযোগ্য)
            - 🪟 **Windows**: `TadbeerGo Setup.exe`
            - 🍏 **Apple macOS**: `TadbeerGo.dmg`
            - 🐧 **Linux**: `TadbeerGo.AppImage` / `.deb`

            *ওয়েবসাইট লিঙ্ক: https://tadbeergo.vercel.app/*
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
